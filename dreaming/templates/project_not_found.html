<!DOCTYPE html>
<html lang="{{ locale|default('ru') }}">
<head>
  <meta charset="utf-8">
  <title>{{ "project_not_found.title" | t(locale=locale) }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/components.css">
</head>
<body>
<main class="max-w-xl mx-auto mt-20 p-8">
  <div class="empty-state">
    <p class="empty-state__title">{{ "project_not_found.h1" | t(locale=locale, slug=slug) }}</p>
    {% if is_disabled %}
    <p>{{ "project_not_found.disabled" | t(locale=locale) }}</p>
    {% else %}
    <p>{{ "project_not_found.check_slug" | t(locale=locale) }}</p>
    {% endif %}
    <p><a href="/projects" class="text-brand-hover underline">{{ "project_not_found.go_list" | t(locale=locale) }}</a></p>
  </div>
</main>
</body>
</html>
